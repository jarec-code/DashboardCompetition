<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Competition Checker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <strong>Competition Checker</strong>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Comparison</a>
      <a href="{{ url_for('products') }}" class="{{ 'active' if request.endpoint == 'products' }}">Our products</a>
      <a href="{{ url_for('competitors') }}" class="{{ 'active' if request.endpoint in ('competitors', 'competitor_detail') }}">Competitors</a>
    </nav>
  </header>
  <main>
    {% for category, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
